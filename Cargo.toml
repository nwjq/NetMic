[workspace]
members = [
  "crates/netmic-proto",
  "crates/netmic-server",
  "crates/netmic-client",
  "apps/netmic-ui/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["NetMic Agents"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
