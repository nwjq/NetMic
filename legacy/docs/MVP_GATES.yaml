{
  "version": 1,
  "updated_at": "2026-01-27",
  "source_of_truth": [
    "MVP.md",
    "docs/ROADMAP.md"
  ],
  "verify_defaults": {
    "success_exit_codes": [0],
    "blocked_exit_codes": [126, 127],
    "timeout_sec": 300
  },
  "blocked_patterns_default": [
    "command not found",
    "not found",
    "No such file or directory",
    "Permission denied",
    "Operation not permitted",
    "operation not permitted",
    "permission denied",
    "device not found",
    "pactl:"
  ],
  "gates": [
    {
      "id": "M0",
      "title": "服务端注入基础能力（可重复自测）",
      "description": "以 stub 测试保证 Linux 注入脚本具备可重复、可演进的最小正确性。",
      "doc_refs": [
        "docs/ROADMAP.md#milestone-0",
        "MVP.md#6"
      ],
      "checks": [
        {
          "id": "m0-audio-selfcheck-stub",
          "name": "audio_selfcheck 最小 stub 测试",
          "run": "scripts/linux/audio_selfcheck_test.sh",
          "timeout_sec": 60
        },
        {
          "id": "m0-virtual-mic-stub",
          "name": "virtual_mic 最小 stub 测试",
          "run": "scripts/linux/virtual_mic_test.sh",
          "timeout_sec": 60
        },
        {
          "id": "m0-virtual-mic-smoke-stub",
          "name": "virtual_mic_smoke 最小 stub 测试",
          "run": "scripts/linux/virtual_mic_smoke_test.sh",
          "timeout_sec": 60
        }
      ]
    },
    {
      "id": "M1",
      "title": "端到端基本通路（默认参数）",
      "description": "至少具备可编译的 client/server 骨架，并能通过最小健康检查。",
      "doc_refs": [
        "docs/ROADMAP.md#milestone-1",
        "MVP.md#5"
      ],
      "checks": [
        {
          "id": "m1-cargo-check",
          "name": "Rust 工作区可编译（cargo check）",
          "run": "cargo check",
          "timeout_sec": 600,
          "blocked_patterns": [
            "could not find `Cargo.toml`",
            "toolchain",
            "rustup"
          ]
        },
        {
          "id": "m1-hub-health",
          "name": "Hub 健康检查（协调面最小可用）",
          "run": "python3 scripts/e2e_smoke.py --mode health --hub \"${HUB_URL:-http://127.0.0.1:7788}\"",
          "timeout_sec": 60
        }
      ]
    },
    {
      "id": "M2",
      "title": "参数安全范围与回退机制",
      "description": "参数校验/回退逻辑具备自动化测试入口，并与 MVP 安全范围一致。",
      "doc_refs": [
        "docs/ROADMAP.md#milestone-2",
        "MVP.md#3"
      ],
      "checks": [
        {
          "id": "m2-config-tests",
          "name": "配置/参数相关测试（cargo test --workspace）",
          "run": "cargo test --workspace",
          "timeout_sec": 900,
          "blocked_patterns": [
            "toolchain",
            "rustup"
          ]
        }
      ]
    },
    {
      "id": "M3",
      "title": "稳定性与恢复能力",
      "description": "围绕稳定运行与恢复窗口目标提供长测入口（可先占位，逐步变实）。",
      "doc_refs": [
        "docs/ROADMAP.md#milestone-3",
        "MVP.md#8"
      ],
      "checks": [
        {
          "id": "m3-long-smoke",
          "name": "长时 smoke 入口（占位：后续替换为真实链路）",
          "run": "python3 scripts/e2e_smoke.py --mode health --hub \"${HUB_URL:-http://127.0.0.1:7788}\"",
          "timeout_sec": 120
        }
      ]
    }
  ]
}
